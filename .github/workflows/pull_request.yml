name: Pull request

permissions:
  contents: read

on:
  push:
    branches: ['ci/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    needs: [soundness, space-format-check]
    with:
      enable_cross_pr_testing: true
      linux_os_versions: '["noble", "rhel-ubi9"]'
      linux_pre_build_command: ./.github/scripts/prebuild.sh
      linux_build_command: 'swift test --no-parallel --filter "SWBCoreTests|SWBTaskExecutionTests"'
      linux_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      linux_host_archs: '["x86_64"]'
      freebsd_pre_build_command: ./.github/scripts/prebuild.sh
      freebsd_build_command: 'swift test --no-parallel'
      enable_freebsd_checks: false
      windows_build_timeout: 180
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_build_command: 'Invoke-Program swift test --no-parallel --filter "SWBCoreTests|SWBTaskExecutionTests"'
      enable_linux_static_sdk_build: false
      enable_android_sdk_build: false
      android_sdk_build_command: "swift build --build-tests"
      android_ndk_versions: '["r27d", "r29"]'
      linux_static_sdk_build_command: SWIFTBUILD_STATIC_LINK=1 LLBUILD_STATIC_LINK=1 swift build
      enable_ios_checks: false
      enable_macos_checks: true
      macos_xcode_versions: '["swift_6.4"]'
      ios_host_xcode_versions: '["swift_6.4"]'
      macos_pre_build_command: ./.github/scripts/prebuild.sh
      macos_build_command: 'swift test --no-parallel --filter "SWBCoreTests|SWBTaskExecutionTests"'
  tests_without_docker:
    name: Test without Docker
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.14
    needs: [soundness, space-format-check]
    with:
      enable_linux_checks: false
      enable_windows_docker: false
      windows_build_timeout: 180
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_build_command: 'Invoke-Program swift test --no-parallel --filter "SWBCoreTests|SWBTaskExecutionTests"'
      windows_os_versions: '["windows-2022", "windows-11-arm"]'
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.14
    with:
      license_header_check_project_name: "Swift"
      api_breakage_check_enabled: false
      format_check_enabled: false

  space-format-check:
    name: Space format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run space format check
        run: cat .github/scripts/format-check.sh | bash
